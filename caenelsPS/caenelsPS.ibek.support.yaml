# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: caenels

entity_models:
  - name: histar
    description: |-
      This will create an instance of CAENELS HiStar PS
    parameters:
      P:
        type: str
        description: Device Prefix
      R:
        type: str
        description: Device Suffix
      IP:
        type: str
        description: |-
          IP address of the Power Supply
        default: 127.0.0.1 ## localhost
      TCPPORT:
        type: int
        description: |-
          TCP PORT of the Power Supply
        default: 10001

      range:
        type: int
        description: |-
          Current channels range
        default: 30
      
      OMAX:
        type: int
        description: |-
          Output MAX
        default: 0
      IMAX:
        type: int
        description: |-
          Current MAX
        default: 0
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{R}}_ASYN", "{{IP}}:{{TCPPORT}}", 0,0,0)
          epicsEnvSet "STREAM_PROTOCOL_PATH", "/epics/support/configure/protocol/"

    databases:
      - file: caenels-hs.db
        args:
          P:
          R:
          PORT: '{{R}}_ASYN'
          RANGE: '{{range}}'

      ## unimag interface overlay
      - file: unimag-histar.db
        args:
          P:
          R:
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'

  - name: fastps
    description: |-
      This will create an instance of CAENELS FASTPS
    parameters:
      P:
        type: str
        description: Device Prefix
      R:
        type: str
        description: Device Suffix
      IP:
        type: str
        description: |-
          IP address of the Power Supply
        default: 127.0.0.1 ## localhost
      TCPPORT:
        type: int
        description: |-
          TCP PORT of the Power Supply
        default: 10001

      rangeI:
        type: int
        description: |-
          Current channels range
        default: 30
      rangeV:
        type: int
        description: |-
          Voltage channels range
        default: 20
      OMAX:
        type: int
        description: |-
          Output MAX
        default: 0
      IMAX:
        type: int
        description: |-
          Current MAX
        default: 0
      rampI:
        type: float
        description: |-
          Current slew rate in A/s (0 = use 10% of rangeI)
        default: 0
      rampV:
        type: float
        description: |-
          Voltage slew rate in V/s (0 = use 10% of rangeV)
        default: 0
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{R}}_ASYN", "{{IP}}:{{TCPPORT}}", 0,0,0)
          epicsEnvSet "STREAM_PROTOCOL_PATH", "/epics/support/configure/protocol/"

    databases:
      - file: fastps.db
        args:
          P:
          R:
          PORT: '{{R}}_ASYN'
          RANGEI: '{{rangeI}}'
          RANGEV: '{{rangeV}}'
          RAMPI: '{{rampI}}'
          RAMPV: '{{rampV}}'

      ## unimag interface overlay
      - file: unimag-fastps.db
        args:
          P:
          R:
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'
