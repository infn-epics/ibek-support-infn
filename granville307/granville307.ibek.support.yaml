# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: granville307

entity_models:
  - name: gateway
    description: |-
      Shared Moxa TCP serial connection for one or more Granville-Phillips 307
      controllers on an addressed RS-485 line.
    parameters:
      name:
        type: id
        description: Asyn port name for the Moxa TCP serial connection.
      IP:
        type: str
        description: Moxa NPort IP address.
        default: 127.0.0.1
      TCPPORT:
        type: int
        description: Moxa TCP server port mapped to the serial line.
        default: 4008
      PROTO:
        type: str
        description: StreamDevice protocol. Defaults to addressed RS-485.
        default: granville307-rs485.proto

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{name}}", "{{IP}}:{{TCPPORT}}", 0, 0, 0)
          epicsEnvSet "STREAM_PROTOCOL_PATH", "/epics/support/configure/protocol/"

  - name: controller
    description: |-
      One Granville-Phillips Series 307 controller on a shared Moxa connection.
    parameters:
      gateway:
        type: object
        description: Reference to the shared granville307.gateway entity.
      name:
        type: id
        description: Controller name, usually the gauge PV prefix.
      P:
        type: str
        description: PV prefix for this controller, for example VUGTR001.
      ADDR:
        type: str
        description: Two-digit hexadecimal RS-485 address of the 307.
        default: "01"
      PRES_UNIT_DEFAULT:
        type: enum
        description: Initial PRES_RB units; 0 is Torr and 1 is Bar.
        values:
          "0":
          "1":
        default: "1"

    databases:
      - file: $(GRANVILLE307)/db/granville307.db
        args:
          P: "{{P}}"
          PORT: "{{gateway.name}}"
          ADDR: "{{ADDR}}"
          PROTO: "{{gateway.PROTO}}"
          PRES_UNIT_DEFAULT: "{{PRES_UNIT_DEFAULT}}"
