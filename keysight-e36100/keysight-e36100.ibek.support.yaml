# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json
# Generated by the ARGUS IOC engineer (ioc_scaffold_module) from the module's description.

module: e36100
entity_models:
- name: controller
  description: |
    Keysight E36100B series DC power supply (E36103B 20 V / 2 A) (asyn).
  parameters:
    name:
      type: id
      description: The controller's asyn port name
    P:
      type: str
      description: Device PV prefix (the IOC's iocprefix)
    R:
      type: str
      description: Device PV suffix (the device name)
      default: ''
    IP:
      type: str
      description: Device or terminal-server address
      default: 192.168.1.60
    TCPPORT:
      type: int
      description: TCP port
      default: 5025
    POLL:
      type: float
      description: Seconds between polls of the readbacks
      default: 1.0
    TIMEOUT:
      type: float
      description: Reply timeout in seconds
      default: 2.0
    RETRY_DELAY:
      type: float
      default: 2.0
      description: Seconds between command retries of the state programs
  pre_init:
  - value: |
      drvAsynIPPortConfigure("{{name}}_IO", "{{IP}}:{{TCPPORT}}", 0, 0, 0)
      asynOctetSetInputEos("{{name}}_IO", 0, "\n")
      asynOctetSetOutputEos("{{name}}_IO", 0, "\n")
      e36100Configure("{{name}}", "{{name}}_IO", {{POLL}}, {{TIMEOUT}})
  databases:
  - file: e36100.template
    args:
      P: '{{P}}'
      R: '{{R}}'
      PORT: '{{name}}'
      TIMEOUT: '{{TIMEOUT}}'
  - file: e36100RampOn.template
    args:
      P: '{{P}}'
      R: '{{R}}'
  - file: e36100SafeOff.template
    args:
      P: '{{P}}'
      R: '{{R}}'
  post_init:
  - value: |
      seq e36100RampOn, "P={{P}},R={{R}},RETRY_DELAY={{RETRY_DELAY}}"
      seq e36100SafeOff, "P={{P}},R={{R}},RETRY_DELAY={{RETRY_DELAY}}"
