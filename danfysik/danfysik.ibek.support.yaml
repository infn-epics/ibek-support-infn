# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: danfysik

entity_models:
  - name: tcp
    description: |-
      TCP/IP moxa connection for Danfysik SYS8X00 power supply
    parameters:
      NAME:
        type: id
        description: |-
          Asyn port name
      IP:
        type: str
        description: |-
          IP address of the power supply
      PORT:
        type: int
        description: |-
          TCP port number
        default: 4001

    pre_init:
      - value: |
          epicsEnvSet("STREAM_PROTOCOL_PATH", "/epics/support/configure/protocol")
          drvAsynIPPortConfigure("{{NAME}}", "{{IP}}:{{PORT}}", 0, 0, 0)

  - name: ps
    description: |-
      Danfysik SYS8X00 power supply instance
    parameters:
      NAME:
        type: id
        description: Device suffix
      P:
        type: str
        description: Device prefix
      PORT:
        type: str
        description: Asyn port name
      ADDR:
        type: int
        description: Power supply address (0-63)
        default: 1
      IMAX:
        type: float
        description: Maximum current in Amperes
        default: 100.0
      VMAX:
        type: float
        description: Maximum voltage in Volts
        default: 25.0
      PREC:
        type: int
        description: Precision for display
        default: 3
      model:
        type: str
        description: |-
          Controller firmware, picks the database variant:
            sys8800 - "DANFYSIK A/S SYSTEM 8800 SB" (32-char S1, ADCV); danfysik.template only.
            sys80it - System 8000 "SPEC.ITALIEN BY OH-ELECTRONICS" (24-char S1, no ADCV/?1/?2,
                      VER needs a pause); adds the danfysik_sys80it.template overlay.
        default: sys8800
      SCAN_FAST:
        type: str
        description: Scan of the state/current readbacks (S1, RA, current, polarity)
        default: 1 second
      SCAN_SLOW:
        type: str
        description: Scan of settings and housekeeping readbacks
        default: 10 second
      SCAN_DIAG:
        type: str
        description: |-
          Scan of the raw/duplicate diagnostics (sys80it only). Any menuScan choice:
          Passive, 10/5/2/1/.5/.2/.1 second (nothing slower than 10 s exists).
        default: Passive
      unimag_enable:
        type: bool
        description: Enable UNIMAG sequencer for bipolar operation
        default: true
      debug:
        type: int
        description: Debug level for UNIMAG sequencer
        default: 1
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    databases:
      - file: danfysik.template
        args:
          DEVICE: '{{P}}'
          PORT: '{{PORT}}'
          ADDR: '{{ADDR}}'
          IMAX: '{{IMAX}}'
          VMAX: '{{VMAX}}'
          PREC: '{{PREC}}'
          SCAN_FAST: '{{SCAN_FAST}}'
          SCAN_SLOW: '{{SCAN_SLOW}}'
      - file: danfysik_unimag.template
        args:
          DEVICE: '{{P}}'
          IMAX: '{{IMAX}}'
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'
        enabled: '{{unimag_enable}}'
      # Must come after danfysik.template and danfysik_unimag.template: it
      # redefines fields of records loaded by both.
      - file: danfysik_sys80it.template
        args:
          DEVICE: '{{P}}'
          PORT: '{{PORT}}'
          ADDR: '{{ADDR}}'
          IMAX: '{{IMAX}}'
          VMAX: '{{VMAX}}'
          SCAN_SLOW: '{{SCAN_SLOW}}'
          SCAN_DIAG: '{{SCAN_DIAG}}'
        enabled: '{{ model == "sys80it" }}'
      - file: danfysik_sys80it_unimag.template
        args:
          DEVICE: '{{P}}'
        enabled: '{{ unimag_enable and model == "sys80it" }}'

    post_init:
      - type: text
        when: '{{unimag_enable}}'
        value: |
          seq danfysikUnimagControl, "device={{P}}, debug={{debug}}"
  