# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: ocem

entity_models:
  - name: modbusps
    description: |-
      This will create an instance of OCEM Modbus PS
    parameters:
      P:
        type: str
        description: Device Prefix
      R:
        type: str
        description: Device Suffix
      IP:
        type: str
        description: |-
          IP address of the Power Supply
        default: 127.0.0.1 ## localhost
      TCPPORT:
        type: int
        description: |-
          TCP PORT of the Power Supply
        default: 502
      VMAX:
        type: int
        description: |-
          Output MAX
        default: 16
      IMAX:
        type: int
        description: |-
          Current MAX
        default: 100

      CORRECTION:
        type: float
        description: |-
          Euristic correction factor for current conversion
        default: 1.8

      CORRECTIONSET:
        type: float
        description: |-
          Euristic correction factor for current conversion
        default: 1
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0
    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{R}}_ASYN", "{{IP}}:{{TCPPORT}}", 0,0,0)
          modbusInterposeConfig("{{R}}_ASYN", 0, 0, 0)
          drvModbusAsynConfigure("{{R}}_command_port", "{{R}}_ASYN", 1, 6, 0, 3, 0, 1000, "OCEM")
          drvModbusAsynConfigure("{{R}}_readback_all", "{{R}}_ASYN", 1, 4, 20, 7, 0, 1000, "OCEM")
          

    databases:
      - file: OCEMPowerSupply.db
        args:
          P:
          R:
          READ_ALL: "{{R}}_readback_all"
          CMD_PORT: "{{R}}_command_port"
          IMAX:
          VMAX:
          CORRECTION:
          CORRECTIONSET:

      ## unimag interface overlay
      - file: unimag-ocem.db
        args:
          P:
          R:
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'

  - name: modbusps4chan
    description: |-
     OCEM Modbus Power Supply - 4 channels version

    parameters:
     P:
      type: str
      description: Device Prefix
     R:
      type: str
      description: Device Suffix
     IP:
      description: |-
          IP address of the Power Supply
      type: str
      default: 127.0.0.1
     TCPPORT:
      description: |-
          TCP PORT of the Power Supply
      type: int
      default: 502

     VMAX:
      description: |-
          Voltage MAX
      type: int
      default: 16
     IMAX:
      description: |-
          Current MAX
      type: int
      default: 30
     ZERO_TOLERANCE:
      type: float
      description: |-
       Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
       Live PV ZERO_TOLERANCE.
      default: 0.5
     SET_TOLERANCE:
      type: float
      description: |-
       Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
       (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
      default: 1.0
     SET_TIMEOUT_S:
      type: float
      description: |-
       Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
       SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
       Live PV SET_TIMEOUT_S.
      default: 30.0

    pre_init:
    - value: |
        drvAsynIPPortConfigure("{{R}}_ASYN", "{{IP}}:{{TCPPORT}}", 0,0,0)
        modbusInterposeConfig("{{R}}_ASYN", 0, 0, 0)

        drvModbusAsynConfigure("{{R}}_command_port", "{{R}}_ASYN", 1, 6, 0, 13, 0, 1000, "OCEM")
        drvModbusAsynConfigure("{{R}}_readback_all", "{{R}}_ASYN", 1, 4, 20, 23, 0, 1000, "OCEM")

    databases:
    - file: OCEMPowerSupply4chan.db
      args:
        P:
        R:
        READ_ALL: "{{R}}_readback_all"
        CMD_PORT: "{{R}}_command_port"
        IMAX:
        VMAX:
        

    - file: unimag-ocem4chan.db
      args:
        P:
        R:
        SET_TOLERANCE: '{{SET_TOLERANCE}}'
        ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
        SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'

