# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json

module: hazemeyer

entity_models:
  - name: serial
    description: |-
      This will create an instance of CAENELS HiStar PS
    parameters:
      NAME:
        type: id
        description: |-
          Device Suffix
      P:
        type: str
        description: Device Prefix
      IP:
        type: str
        description: |-
          IP address of the Power Supply
        default: 127.0.0.1 ## localhost
      TCPPORT:
        type: int
        description: |-
          TCP PORT of the Power Supply
        default: 4001
      TIMEOUT:
        type: int
        description: |-
          Timeout
        default: 1000
      WDELAY:
        type: int
        description: |-
          Write Delay
        default: 200

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{NAME}}_ASYN", "{{IP}}:{{TCPPORT}}", 0,0,1)
          modbusInterposeConfig("{{NAME}}_ASYN", 1, {{TIMEOUT}}, {{WDELAY}})


  - name: tcp_iocast
    description: |-
      This will create an instance of Hazemeyer PS (TCP/IP Modbus)
    parameters:
      NAME:
        type: id
        description: Device Suffix
      P:
        type: str
        description: Device Prefix
      IP:
        type: str
        description: IP address of the Power Supply
        default: 192.168.0.117
      TCPPORT:
        type: int
        description: TCP port of the Power Supply
        default: 502

    pre_init:
      - value: |
          drvAsynIPPortConfigure("{{NAME}}_ASYN", "{{IP}}:{{TCPPORT}}", 0, 0, 1)
          modbusInterposeConfig("{{NAME}}_ASYN", 0, 0, 0)



  - name: ps
    description: |-
      This will create an instance of CAENELS FASTPS
    parameters:
      serctrl:
        type: object
        description: |-
          Serial controller
      R:
        type: str
        description: Device Suffix
      VMAX:
        type: int
        description: |-
          Voltage MAX
        default: 0
      IMAX:
        type: int
        description: |-
          Current MAX
        default: 0
      ID:
        type: int
        description: |-
          ID of the Power Supply
        default: 0
      RPOLL:
        type: int
        description: |-
          Read Polling time in ms
        default: 2000
      WPOLL:
        type: int
        description: |-
          write Polling time in ms
        default: 200
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0
      

    pre_init:
      - value: |
          ## ps {{R}} Write holding registers slave {{ID}} 
          drvModbusAsynConfigure("{{R}}_PORT_WAO", "{{serctrl.NAME}}_ASYN", {{ID}},    16, 4, 4, 0, {{WPOLL}}, "HAZEMEYER")
          ## ps {{R}} Read holding registers slave {{ID}}
          drvModbusAsynConfigure("{{R}}_PORT_RAO", "{{serctrl.NAME}}_ASYN", {{ID}},    3, 4, 12, 0, {{RPOLL}}, "HAZEMEYER")

    databases:
      - file: hz.db
        args:
          P: '{{serctrl.P}}'
          R: '{{R}}'
          PORT: '{{R}}_PORT_RAO'
          WPORT: '{{R}}_PORT_WAO'
          IMAX: '{{IMAX}}'
          VMAX: '{{VMAX}}'
          TIMEOUT: '{{serctrl.TIMEOUT}}'
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'
    

  - name: ps_iocast
    description: |-
      This will create an instance of IOCAST PS
    parameters:
      tcpctrl:
        type: object
        description: |-
          Serial controller
      R:
        type: str
        description: Device Suffix

      ID:
        type: int
        description: |-
          ID of the Power Supply
        default: 0
      POLL:
        type: int
        description: |-
          Polling time in ms
        default: 1000

      TIMEOUT: 
        type: int
        description: Timeout in ms 
        default: 2000
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 1.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    pre_init:
      - value: |
          ## Read holding registers (0–37)
          drvModbusAsynConfigure("{{R}}_PORT_RAO", "{{tcpctrl.NAME}}_ASYN", 1, 3, 0, 37, 0, {{POLL}}, "HAZEMEYER")
          ## Write holding registers (0–7)
          drvModbusAsynConfigure("{{R}}_PORT_WAO", "{{tcpctrl.NAME}}_ASYN", 1, 6, 0, 7, 0, 500, "HAZEMEYER")


    databases:
      - file: hz_iocast.db
        args:
          P: '{{tcpctrl.P}}'
          R: '{{R}}'
          PORT: '{{R}}_PORT_RAO'
          WPORT: '{{R}}_PORT_WAO'
          TIMEOUT: '{{TIMEOUT}}'
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'


  # CHV TL cubicle on the CITBus (hazemeyer-citbus): the Main Monitoring Unit (MMU)
  # is a Modbus RTU slave fronting 8 channels (MAU0..MAU7). The gateway is a
  # hazemeyer.serial entity; the databases come from the hazemeyer-citbus module.
  - name: cit
    description: |-
      Hazemeyer CHV TL cubicle (CITBus module): MMU Modbus slave with 8 channels
    parameters:
      NAME:
        type: id
        description: |-
          Cubicle id, prefix of its modbus ports
      serctrl:
        type: object
        description: |-
          Serial gateway (hazemeyer.serial)
      ID:
        type: int
        description: |-
          Modbus slave address of the MMU. The cubicle is named after it: PVs $(P):CIT<ID>:...
      MEAS_POLL:
        type: int
        description: |-
          Polling time in ms of the measurements ($0080-$00CB, read in two blocks)
        default: 500
      STS_POLL:
        type: int
        description: |-
          Polling time in ms of the detailed faults / statuses ($0020-$003F)
        default: 1000
      TIMEOUT:
        type: int
        description: |-
          asyn timeout in ms
        default: 1000
      PULSE:
        type: float
        description: |-
          Command pulse width in s (command word written, then cleared)
        default: 0.5
      ON_DLY:
        type: float
        description: |-
          Delay in s between Standby and Power On when the cubicle is switched ON from Energized
        default: 3.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the cubicle state watchdog (ST_NOT_REACHED, STATE_RB=7). Live PV SET_TIMEOUT_S.
        default: 30.0

    pre_init:
      - value: |
          ## cubicle CIT{{ID}}: word area $0080-$00CB in two reads (32 + 44 words): serial
          ## gateways split replies at 104 bytes and the modbus RTU layer needs each in one read
          ## cubicle CIT{{ID}}: mains measurements $0080-$009F
          drvModbusAsynConfigure("{{NAME}}_MEAS", "{{serctrl.NAME}}_ASYN", {{ID}}, 3, 0x80, 32, 0, {{MEAS_POLL}}, "HAZEMEYER")
          ## cubicle CIT{{ID}}: MAU voltages/currents, general and MAU ready/power $00A0-$00CB
          drvModbusAsynConfigure("{{NAME}}_MEAS2", "{{serctrl.NAME}}_ASYN", {{ID}}, 3, 0xA0, 44, 0, {{MEAS_POLL}}, "HAZEMEYER")
          ## cubicle CIT{{ID}}: general and MAU faults / statuses $0020-$003F
          drvModbusAsynConfigure("{{NAME}}_STS", "{{serctrl.NAME}}_ASYN", {{ID}}, 3, 0x20, 32, 0, {{STS_POLL}}, "HAZEMEYER")
          ## cubicle CIT{{ID}}: general and MAU commands $0000-$001F
          drvModbusAsynConfigure("{{NAME}}_CMD", "{{serctrl.NAME}}_ASYN", {{ID}}, 6, 0x00, 32, 0, 1, "HAZEMEYER")
          ## cubicle CIT{{ID}}: MAU current settings $0060-$0067
          drvModbusAsynConfigure("{{NAME}}_ISET", "{{serctrl.NAME}}_ASYN", {{ID}}, 6, 0x60, 8, 0, 1, "HAZEMEYER")

    databases:
      - file: hzacc_cubicle.db
        args:
          P: '{{serctrl.P}}'
          R: 'CIT{{ID}}'
          PORT_MEAS: '{{NAME}}_MEAS'
          PORT_MEAS2: '{{NAME}}_MEAS2'
          PORT_CMD: '{{NAME}}_CMD'
          TIMEOUT: '{{TIMEOUT}}'
          PULSE: '{{PULSE}}'
          ON_DLY: '{{ON_DLY}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'


  - name: cit_channel
    description: |-
      One channel (MAU) of a Hazemeyer CHV TL cubicle, UNIMAG power supply
    parameters:
      cit:
        type: object
        description: |-
          Cubicle (hazemeyer.cit)
      R:
        type: str
        description: |-
          Channel (magnet) name, PVs $(P):$(R):...
      CHANNEL:
        type: int
        description: |-
          Channel number 0..7 (MAU0..MAU7, chanel #1..#8 of the drawings)
      IMAX:
        type: float
        description: |-
          Full scale current in A
        default: 10.0
      VMAX:
        type: float
        description: |-
          Full scale voltage in V
        default: 20.0
      RAWMAX_SP:
        type: int
        description: |-
          Raw current setting at IMAX (signed, bipolar). Measured against the reference
          control system: raw 410 = 2.000 A at IMAX 10
        default: 2048
      RAWMAX_RB:
        type: int
        description: |-
          Raw current / voltage readback at IMAX / VMAX (signed). Measured against the
          reference control system: raw 1644 = 2.000 A at IMAX 10
        default: 8192
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.05
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 0.1
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    # asyn offsets of channel n: current $00C4+n and voltage $00A1+4n in the
    # MEAS2 port ($00A0), faults $0030+2n and status $0031+2n in the STS port
    # ($0020), commands $0010+2n in the CMD port ($0000), setting $0060+n in ISET
    databases:
      - file: hzacc_channel.template
        args:
          P: '{{cit.serctrl.P}}'
          R: '{{R}}'
          CUB: 'CIT{{cit.ID}}'
          PORT_MEAS2: '{{cit.NAME}}_MEAS2'
          PORT_STS: '{{cit.NAME}}_STS'
          PORT_CMD: '{{cit.NAME}}_CMD'
          PORT_ISET: '{{cit.NAME}}_ISET'
          TIMEOUT: '{{cit.TIMEOUT}}'
          PULSE: '{{cit.PULSE}}'
          CH: '{{CHANNEL}}'
          IRB: '{{36 + CHANNEL}}'
          VRB: '{{1 + 4 * CHANNEL}}'
          FLT: '{{16 + 2 * CHANNEL}}'
          STS: '{{17 + 2 * CHANNEL}}'
          CMD: '{{16 + 2 * CHANNEL}}'
          ISET: '{{CHANNEL}}'
          IMAX: '{{IMAX}}'
          VMAX: '{{VMAX}}'
          RAWMAX_SP: '{{RAWMAX_SP}}'
          RAWMAX_RB: '{{RAWMAX_RB}}'
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'
      # position aliases $(P):CIT<ID>:CH1..CH8:... for the cubicle OPI (hzacc.bob)
      - file: hzacc_channel_alias.template
        args:
          P: '{{cit.serctrl.P}}'
          R: '{{R}}'
          CUB: 'CIT{{cit.ID}}'
          CHN: '{{CHANNEL + 1}}'
