# yaml-language-server: $schema=https://github.com/epics-containers/ibek/releases/download/3.1.2/ibek.support.schema.json


module: TTI

entity_models:
  - name: device
    description: |-
      TTI Power Supply device connected via TCP/IP
    parameters:
      NAME:
        type: id
        description: |-

      P:
        type: str
        description: |-
          PV name prefix 
      R:
        type: str
        description: |-
          PV name suffix

      IP:
        type: str
        description: |-
          IP address
        default: 192.168.197.49

      PORT:
        type: int
        description: |-
          TCP port number for device communication
        default: 4001

      TIMEOUT:
        type: int
        description: |-
          Connection timeout in milliseconds
        default: 1000

      DISCONNECT_ON_TIMEOUT:
        type: bool
        description: |-
          Whether to disconnect from the device on read timeout
        default: true
      ZERO_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which a zero current setpoint counts as reached (UNIMAG watchdog).
          Live PV ZERO_TOLERANCE.
        default: 0.5
      SET_TOLERANCE:
        type: float
        description: |-
          Tolerance in A within which the readback must get of CURRENT_SP, otherwise SP_NOT_REACHED
          (STATE_RB=6, MINOR) is raised after SET_TIMEOUT_S. 0 disables the check. Live PV SET_TOLERANCE.
        default: 0.0
      SET_TIMEOUT_S:
        type: float
        description: |-
          Timeout in s of the UNIMAG watchdogs, restarted on progress. An unreached setpoint gives
          SP_NOT_REACHED (STATE_RB=6), an unreached commanded state ST_NOT_REACHED (STATE_RB=7, MAJOR).
          Live PV SET_TIMEOUT_S.
        default: 30.0

    pre_init:
      - value: |
          epicsEnvSet "STREAM_PROTOCOL_PATH", "$(TTI_PS)/db"
          drvAsynIPPortConfigure("{{NAME}}", "{{IP}}:{{PORT}}", 0, 0, 0)
          # asynSetOption("{{NAME}}", 0, "disconnectOnReadTimeout", "{% if DISCONNECT_ON_TIMEOUT %}Y{% else %}N{% endif %}")

    databases:
      - file: TTI.template
        args:
          P: "{{P}}"          
          R: "{{R}}"          
          PORT: "{{NAME}}"    
          SET_TOLERANCE: '{{SET_TOLERANCE}}'
          ZERO_TOLERANCE: '{{ZERO_TOLERANCE}}'
          SET_TIMEOUT_S: '{{SET_TIMEOUT_S}}'
